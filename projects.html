    var convoyclicked = false;
    var convoyindice = 0;
    var convoyhovertext = "Convoy ⬎"
    var convoyishovered = false;
    const convoy_newtext = "Convoy is an extremely fast network scanner capable of above 300k packets per second, utilizing AF_XDP, rust, multithreading, and more. I used it to find and audit large security holes in my colleges network, including unprotected access to every lecture camera and projector."
    function convoyClick() {
        const convoytext = document.getElementById("convoytext");
        convoytext.style.padding = "calc(1vh + 1vw)";
        const projectconvoy = document.getElementById("projectconvoy");
        const convoylinkdiv = document.getElementById("convoylinkdiv");
        projectconvoy.setAttribute('onclick', 'convoyUnclick();');
        convoyclicked = true;
        const localconvoyspecifier = Math.random();
        convoyspecifier = localconvoyspecifier
        if (convoyishovered == true) {
            const convoyheader = document.getElementById("convoyheader");
            convoyheader.textContent = "Convoy ⬏"
        };
        convoyhovertext = "Convoy ⬏";
        var clicktime = 0;
        for (const num of Array(convoy_newtext.split(" ").length + 1 - convoyindice).fill(0)) {
            setTimeout(function() {
                if (convoyspecifier == localconvoyspecifier) {
                    convoytext.textContent = convoy_newtext.split(" ").splice(0, convoyindice).join(" ");
                    convoyindice = convoyindice + 1;
                };
            }, clicktime);
            clicktime = clicktime + 100;
        };
        setTimeout(function() {
            if (convoyspecifier == localconvoyspecifier) {
                convoylinkdiv.style.display = "";
            };
        }, clicktime);
    };
